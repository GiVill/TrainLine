<div class="station-detail" [class.expanded]="isExpanded()">
  <!-- Header compatto -->
  <div class="station-header-compact">
    <div class="station-title-compact">
      <h2>{{ station.stop_name }}</h2>
      <button
        class="expand-toggle"
        (click)="toggleExpanded()"
        [attr.aria-expanded]="isExpanded()"
        [attr.aria-label]="isExpanded() ? 'Nascondi dettagli' : 'Mostra dettagli'"
      >
        <svg
          class="expand-icon"
          [class.rotated]="isExpanded()"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="6,9 12,15 18,9"></polyline>
        </svg>
      </button>
    </div>

    <!-- Info essenziali -->
    <div class="station-meta-compact">
      <div class="meta-item-compact">
        <span class="meta-label">Zona ID:</span>
        <span class="meta-value">{{ station.zone_id }}</span>
      </div>
      <div class="meta-item-compact">
        <span class="meta-label">Tipo:</span>
        <span class="meta-value">Stazione Ferroviaria</span>
      </div>
      <div class="meta-item-compact">
        <span class="meta-label">Coordinate:</span>
        <span class="meta-value">
          {{ station.stop_lat | number:'1.6-6' }},
          {{ station.stop_lon | number:'1.6-6' }}
        </span>
      </div>
    </div>
  </div>

  <!-- Dettagli espandibili -->
  <div class="station-detail-expanded" [class.visible]="isExpanded()">
    <div class="station-content">
      <div class="diagram-section" style="grid-column: 1 / -1;">
        <h3>Station Map</h3>
        
        <!-- Controlli animazione - solo per la stazione di Cagliari -->
        <div class="animation-controls" *ngIf="station.stop_name === 'Stazione di CAGLIARI'">
          <button 
            class="control-btn start-btn" 
            (click)="startAnimation()" 
            [disabled]="isAnimating"
            [class.disabled]="isAnimating"
            [title]="isAnimating ? 'Animazione in corso' : 'Avvia o riprendi simulazione'"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5,3 19,12 5,21 5,3"></polygon>
            </svg>
            {{ currentIdx === 0 ? 'Avvia simulazione' : 'Riprendi simulazione' }}
          </button>
          
          <button 
            class="control-btn stop-btn" 
            (click)="stopAnimation()" 
            [disabled]="!isAnimating"
            [class.disabled]="!isAnimating"
            title="Metti in pausa la simulazione"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            Pausa
          </button>

          <button 
            class="control-btn reset-btn" 
            (click)="resetAnimation()" 
            [disabled]="isAnimating"
            [class.disabled]="isAnimating"
            title="Riporta la simulazione all'inizio"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23,4 23,10 17,10"></polyline>
              <polyline points="1,20 1,14 7,14"></polyline>
              <path d="M20.49,9A9,9,0,0,0,5.64,5.64L1,10m22,4L18.36,18.36A9,9,0,0,1,3.51,15"></path>
            </svg>
            Reset
          </button>
        </div>

        <div class="map-container">
          <!-- Mostra l'SVG SOLO per la stazione di Cagliari  -->
          <div
            class="map-wrapper"
            *ngIf="station.stop_name === 'Stazione di CAGLIARI'"
          >
            <!-- sostituito <img> con <object>; evento (load) -->
            <object
              #mapObject
              type="image/svg+xml"
              data="assets/cagliari.svg"
              class="map-svg"
              aria-label="Mappa della stazione di Cagliari"
              (load)="onSvgLoad()"
            ></object>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
